# Shared configuration for both build targets.
#
# Consumed via INHERIT by:
#   - mkdocs.yml           internal build  -> macro.int.pgmac.net/incidents/
#   - incidents-mkdoc.yml  public build    -> incidents.pgmac.net.au
#
# Anything that is not a per-target URL or output directory belongs here, so the
# two sites cannot drift apart. Neither build defines a nav — pages are
# discovered from src/ and ordered by mkdocs-awesome-nav.

site_name: Post-Incident Reviews
site_description: Internal post-incident review documentation
site_author: pgmac
docs_dir: src/
repo_name: pgmac-net/incidents
repo_url: https://github.com/pgmac-net/incidents/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - awesome-nav
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  analytics:
    provider: google
    property: G-4TK0898KNM
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pgmac
