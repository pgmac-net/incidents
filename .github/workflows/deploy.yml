name: Deploy to GH Pages and macro.int.pgmac.net

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # GitHub-hosted: mkdocs build and artifact upload only, no homelab dependency.
    # slim is sufficient — pure Python via uv, and no mkdocs-material social-card plugin
    # (which would need Cairo and other system libraries).
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Build site
        run: |
          uv run mkdocs build --clean --strict

      - name: Archive site
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd site
          tar -czf ../site-${COMMIT_SHA}.tar.gz .
          cd ..

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: site-*.tar.gz
          retention-days: 30

      - name: Generate attestation
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: site-*.tar.gz

      - name: Build GitHub Pages site
        run: |
          uv run mkdocs build --config-file incidents-mkdoc.yml --clean --strict
          touch docs/.nojekyll
          echo "incidents.pgmac.net.au" > docs/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: build
    # self-hosted: scp's the built site to macro.int.pgmac.net, which is only
    # reachable from the homelab network. See pgmac-net/homelabia#176.
    runs-on: self-hosted

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build

      - name: Verify attestation
        if: github.event.repository.visibility == 'public'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "🔍 Verifying attestation for public repository..."
          # gh attestation verify "site-${COMMIT_SHA}.tar.gz" --owner ${{ github.repository_owner }}

      - name: Extract site
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "📂 Extracting site..."
          ARTIFACT_FILE="site-${COMMIT_SHA}.tar.gz"

          if [ ! -f "$ARTIFACT_FILE" ]; then
            echo "❌ Site artifact not found: $ARTIFACT_FILE"
            exit 1
          fi

          mkdir -p site
          tar -xzf "$ARTIFACT_FILE" -C site

          echo "✅ Site extracted and ready for deployment"

      - name: Setup the SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PGMAC_SSH }}

      - name: Deploy to macro.int.pgmac.net
        run: |
          echo "📦 Deploying to macro.int.pgmac.net..."
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r site/* paul@macro.int.pgmac.net:/var/www/html/incidents/
          echo "✅ Deployment complete!"

      - name: Deployment summary
        env:
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Site URL: https://macro.int.pgmac.net/incidents/"
          echo "Deployed from: $COMMIT_SHA"
          echo "Deployed by: $ACTOR"

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
